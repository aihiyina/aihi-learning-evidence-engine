<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#173c3b" />
<title>WHYWHY · 질문 연구소</title>
<style>
:root{color-scheme:light;--ink:#193c3a;--muted:#647470;--paper:#f8f5ed;--card:#fffefa;--line:#dcded5;--green:#285d4f;--light:#e4eee7;--orange:#e6a34d;--blue:#dfece9;--red:#9c3f3b}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:#1f3532;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;letter-spacing:-.03em}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.52;cursor:not-allowed}a{color:var(--green)}
header{background:#173b39;color:#fff;min-height:80px;padding:19px max(24px,calc((100vw - 1220px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:13px}.mark{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:15px;background:#ebc87e;color:#193c39;font-size:29px;font-weight:900;letter-spacing:-.12em;transform:rotate(-4deg)}
.wordmark{font-size:23px;font-weight:850;line-height:1}.subbrand{font-size:11px;color:#c5d6d1;letter-spacing:.07em;margin-top:6px}
nav{display:flex;gap:8px}nav button{color:#dfebe8;border:1px solid #4c6a65;background:transparent;padding:11px 15px;border-radius:999px;font-size:14px}nav button.active{background:#f8f5ed;color:#193c39;border-color:#f8f5ed;font-weight:750}
main{max-width:1220px;padding:38px 24px 90px;margin:auto}
.kicker{color:#567368;text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:800}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:27px}.hero h1{font-size:clamp(26px,4vw,43px);font-weight:850;letter-spacing:-.07em;line-height:1.25;margin:10px 0}.hero p{font-size:15px;color:var(--muted);margin:0;line-height:1.65}
.mode-badge{font-size:12px;padding:9px 12px;border:1px solid #d5ba8b;border-radius:999px;background:#fbefd6;color:#805b2d;font-weight:750;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(300px,42%) minmax(340px,58%);gap:20px;align-items:stretch}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 8px 30px rgba(38,59,45,.035)}
.sectionhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}.disc{width:9px;height:9px;border-radius:50%;background:var(--orange)}h2{font-size:21px;margin:0;letter-spacing:-.05em}p{line-height:1.75}.small{font-size:12px;color:#65736c}.divider{height:1px;background:#e6e9df;margin:25px 0}
.scenario{background:#e9efe8;border-radius:18px;padding:24px;margin-top:17px;position:relative;overflow:hidden}.scenario .quote{font-size:19px;font-weight:730;line-height:1.75;letter-spacing:-.04em;max-width:380px;position:relative;z-index:2}.scenario .sun{position:absolute;width:120px;height:120px;border-radius:50%;background:#efd08b;right:-33px;bottom:-38px;opacity:.75}.scenario .leaf{position:absolute;width:70px;height:28px;transform:rotate(-30deg);border-radius:90% 0 90% 0;background:#92b2a0;right:46px;bottom:15px;opacity:.6}
.step-list{display:flex;flex-direction:column;gap:0;margin-top:5px}.step{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid #edf0e9}.step:last-child{border-bottom:0}.step i{font-style:normal;font-size:12px;font-weight:800;width:28px;height:28px;border-radius:50%;border:1px solid #cbd8d0;color:#6d8176;display:flex;align-items:center;justify-content:center}.step.current i{background:#24584b;color:white;border-color:#24584b}.step.done i{background:#dbeadf;color:#24584b;border-color:#dbeadf}.step strong{font-size:14px;font-weight:650}.step.current strong{color:#24584b}.step span{font-size:12px;color:#8a9990;margin-left:auto}
.label{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--green)}.prompt{font-size:clamp(25px,2.6vw,36px);line-height:1.44;font-weight:800;letter-spacing:-.065em;margin:14px 0 14px;max-width:610px}.tip{color:#75817b;font-size:14px;margin:0 0 22px}
textarea{width:100%;min-height:184px;resize:vertical;background:#fcfdf9;border:1.5px solid #cfd9cf;border-radius:16px;padding:20px;color:#193c3a;line-height:1.8;outline:none}textarea:focus{border-color:#2b6c59;box-shadow:0 0 0 3px #dceee2}textarea::placeholder{color:#9eaaa4} .fieldrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.btn{padding:14px 19px;border-radius:12px;border:1px solid #d0dcd3;background:white;color:#22443a;font-size:14px;font-weight:740}.btn.primary{background:#1d5147;color:white;border-color:#1d5147}.btn:hover{filter:brightness(.96)}.btn.danger{color:#a34239;border-color:#e5bcb6;background:#fff9f7}.error{margin-top:10px;font-size:13px;color:var(--red)}
.selector{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:19px 0} .selector button{background:#fff;color:#486858;border:1px solid #cbdacf;border-radius:12px;padding:12px 17px;font-weight:750}.selector button.selected{background:#215347;border-color:#215347;color:white}
.finished{background:#e9f1e9;border:1px solid #cdded1;border-radius:16px;padding:25px}.finished strong{font-size:24px;color:#215347}.finished p{margin-bottom:6px}.timeline{display:grid;gap:10px}.event{border:1px solid #e1e7df;background:#fffefa;border-radius:13px;padding:14px 17px}.event .tag{color:#496c5d;font-size:12px;font-weight:800;letter-spacing:.01em}.event p{margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}.teacher-top{display:grid;grid-template-columns:270px 1fr;gap:20px}.teacher-sessions{display:grid;gap:8px}.sessionbutton{width:100%;border:1px solid #d9e1d9;background:#fffefa;text-align:left;border-radius:12px;padding:14px;color:#173b39}.sessionbutton.selected{border-color:#285d4f;background:#eef5ee}.teacher-note{min-height:115px}.notice{background:#fff5e5;border:1px solid #eed9b8;color:#755329;border-radius:13px;padding:12px 15px;font-size:12px;line-height:1.65;margin-top:22px}
footer{max-width:1220px;margin:0 auto;padding:0 24px 35px;font-size:12px;color:#7c8a81;line-height:1.7}
@media(max-width:760px){header{padding:16px 18px;flex-wrap:wrap}.brand .mark{width:39px;height:39px;font-size:24px}.wordmark{font-size:19px}nav button{padding:9px 12px;font-size:12px}main{padding:27px 15px 45px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:29px}.layout,.teacher-top{grid-template-columns:1fr}.card{padding:23px;border-radius:18px}.scenario .quote{font-size:17px}.prompt{font-size:26px}footer{padding:0 15px 26px}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">?</span><div><div class="wordmark">WHYWHY<span style="color:#e9c880">.</span></div><div class="subbrand">AIHI · QUESTION FIRST LAB</div></div></div>
  <nav aria-label="화면 선택"><button id="studentNav" class="active" onclick="go('student')">학생의 생각</button><button id="teacherNav" onclick="go('teacher')">선생님 관찰</button></nav>
</header>
<main>
 <div class="hero"><div><div class="kicker">Learning to ask, not just answer</div><h1 id="pageTitle">질문이 시작되는 곳.</h1><p id="pageIntro">AI가 대신 답하지 않아요. 내가 생각하고, 묻고, 다시 살펴보는 시간이에요.</p></div><div class="mode-badge">체험 모드 · 실제 학생 정보 입력 금지</div></div>
 <div id="screen"></div>
</main>
<footer>WHYWHY v0.1 · AIHI의 2026년 11월 POC를 위한 개발 시제품입니다. 생성형 AI 연결 없음. 개인정보 동의·실제 학급 인증·교사 권한 통제 미구현으로 실제 학생 대상 사용 및 외부 공개를 금합니다.</footer>
<script>
let mode='student', lesson=null, current=null, allSessions=[], selectedGrade=3, teacherSelected=null;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url, options={}){const res=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!res.ok){let e={};try{e=await res.json()}catch(_){};throw new Error(typeof e.detail==='string'?e.detail:`연결 오류 (${res.status})`)}return res.status===204?null:res.json()}
function error(e){const el=$('#errorBox');if(el)el.textContent=e.message||String(e);else alert(e.message||e)}
function go(m){mode=m;$('#studentNav').classList.toggle('active',m==='student');$('#teacherNav').classList.toggle('active',m==='teacher');$('#pageTitle').textContent=m==='student'?'질문이 시작되는 곳.':'정답보다 변화의 기록.';$('#pageIntro').textContent=m==='student'?'AI가 대신 답하지 않아요. 내가 생각하고, 묻고, 다시 살펴보는 시간이에요.':'아이의 학습 장면을 검토하고 다음 수업을 결정하는 교사 공간입니다.';m==='teacher'?loadTeacher():renderStudent()}
function leftPanel(){return `<section class="card"><div class="sectionhead"><i class="disc"></i><h2>오늘의 탐구</h2></div><div class="label">초등 ${selectedGrade}학년 · ${esc(lesson?.minutes||40)}분</div><div class="scenario"><div class="small">수업용 AI 답변 예시</div><div class="quote">${esc(lesson?.scenario||'')}</div><div class="sun"></div><div class="leaf"></div></div><div class="divider"></div><h2 style="font-size:16px">생각의 발자국</h2><div class="step-list">${(lesson?.steps||[]).map((s,i)=>`<div class="step ${current?.next?.completed>i?'done':current?.next?.completed===i?'current':''}"><i>${current?.next?.completed>i?'✓':i+1}</i><strong>${esc(s.label)}</strong><span>${current?.next?.completed===i?'지금 여기':' '}</span></div>`).join('')}</div><div class="notice">이 활동은 맞고 틀리는 점수를 매기지 않아. 생각을 고치거나 처음 생각을 유지해도 괜찮아.</div></section>`}
function renderStudent(){if(mode!=='student')return;if(!lesson){$('#screen').innerHTML='<div class="card">수업 정보를 여는 중...</div>';return}
let content='';
if(!current){content=`<div class="label">LESSON 01</div><div class="prompt">정말 그럴까?<br>AI의 말을 확인해보자.</div><p class="tip">학년을 고르고 시작해봐. 이름이나 학교는 입력하지 않아도 돼.</p><div class="selector"><button class="${selectedGrade===3?'selected':''}" onclick="setGrade(3)">초등 3학년</button><button class="${selectedGrade===4?'selected':''}" onclick="setGrade(4)">초등 4학년</button></div><div class="actions"><button class="btn primary" onclick="start()">생각 시작하기 →</button></div>`}
else if(current.next.status==='complete'){content=`<div class="finished"><div class="label">나의 생각 여행 완료</div><p><strong>생각을 스스로 이어갔어.</strong></p><p>처음 생각, 네 질문, 확인한 근거, 다시 설명한 내용을 남겼어. 이제 선생님이 그 과정을 살펴볼 수 있어.</p></div><div class="divider"></div><h2>내 생각의 기록</h2><div class="timeline" style="margin-top:16px">${current.events.map(e=>`<div class="event"><div class="tag">${esc(lesson.steps.find(x=>x.kind===e.kind)?.label||e.kind)}</div><p>${esc(e.content)}</p></div>`).join('')}</div><div class="actions"><button class="btn" onclick="downloadRecord()">내 기록 내보내기</button><button class="btn primary" onclick="go('teacher')">선생님 화면 보기 →</button><button class="btn danger" onclick="removeCurrent()">체험 기록 지우기</button></div>`}
else{content=`<div class="label">STEP ${current.next.completed+1} / ${current.next.total} · ${esc(current.next.stage)}</div><div class="prompt">${esc(current.next.prompt)}</div><p class="tip">${esc(current.next.tip)}</p><textarea id="studentAnswer" maxlength="600" placeholder="네 생각을 자유롭게 적어줘. 정답은 아직 필요 없어." aria-label="나의 생각 입력"></textarea><div class="fieldrow"><span class="small">말투나 맞춤법보다 생각이 중요해.</span><span id="counter" class="small">0 / 600</span></div><div class="actions"><button class="btn primary" id="submitBtn" onclick="submitAnswer()">내 생각 남기기 →</button><button class="btn" onclick="downloadRecord()">현재 기록 저장</button><button class="btn danger" onclick="removeCurrent()">체험 기록 지우기</button></div><div id="errorBox" class="error" role="alert"></div>`}
$('#screen').innerHTML=`<div class="layout">${leftPanel()}<section class="card"><div class="sectionhead"><i class="disc"></i><h2>${current?'내 생각을 남기는 공간':'나의 첫 질문'}</h2></div>${content}</section></div>`;
let area=$('#studentAnswer');if(area)area.addEventListener('input',()=>$('#counter').textContent=`${area.value.length} / 600`);
}
function setGrade(n){selectedGrade=n;renderStudent()}
async function start(){try{current=await api('/api/sessions',{method:'POST',body:JSON.stringify({grade:selectedGrade})});sessionStorage.setItem('whywhy_demo_sid',current.id);renderStudent()}catch(e){error(e)}}
async function submitAnswer(){const btn=$('#submitBtn'),text=$('#studentAnswer').value;btn.disabled=true;try{current=await api(`/api/sessions/${encodeURIComponent(current.id)}/events`,{method:'POST',body:JSON.stringify({kind:current.next.kind,content:text})});renderStudent()}catch(e){btn.disabled=false;error(e)}}
async function removeCurrent(){if(!current||!confirm('이 체험 기록을 정말 지울까?'))return;try{await api(`/api/sessions/${encodeURIComponent(current.id)}`,{method:'DELETE'});current=null;sessionStorage.removeItem('whywhy_demo_sid');renderStudent()}catch(e){error(e)}}
function downloadRecord(){if(!current)return;const payload={demo:true,lesson:lesson?.title,session:current,exported_at:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='WHYWHY_demo_learning_evidence.json';a.click();URL.revokeObjectURL(url)}
async function loadTeacher(){try{allSessions=await api('/api/sessions');if(!teacherSelected && allSessions.length)teacherSelected=allSessions[0].id;renderTeacher()}catch(e){$('#screen').innerHTML=`<div class="card">${esc(e.message)}</div>`}}
async function selectTeacher(id){teacherSelected=id;renderTeacher()}
async function renderTeacher(){if(mode!=='teacher')return;let s=null;if(teacherSelected){try{s=await api(`/api/sessions/${encodeURIComponent(teacherSelected)}`)}catch(e){teacherSelected=null}}
let listing=allSessions.map(x=>`<button class="sessionbutton ${teacherSelected===x.id?'selected':''}" onclick="selectTeacher('${esc(x.id)}')"><strong>${esc(x.alias)} · ${x.grade}학년</strong><br><span class="small">기록 ${x.event_count}/5개 · ${esc(x.decision||'미검토')}</span></button>`).join('') || '<p class="small">아직 체험 기록이 없어. 학생 화면에서 활동을 시작해봐.</p>';
const states={approve:'승인',revise:'수정 요청',reject:'반려'};
let panel=s?`<div class="label">질문·수정·설명의 근거</div><h2 style="margin:12px 0 20px">${esc(s.alias)} · ${s.grade}학년 체험 기록</h2><div class="timeline">${s.events.map(e=>`<div class="event"><div class="tag">${esc(lesson.steps.find(x=>x.kind===e.kind)?.label||e.kind)}</div><p>${esc(e.content)}</p></div>`).join('')||'<p class="small">아직 기록이 없어.</p>'}</div><div class="notice">이 화면은 자동 평가가 아니야. 작성된 생각만 보여주며 실제 교사가 교육적 의미를 판단해야 해.</div><div class="divider"></div><div class="label">교사 최종 판단</div><p class="small">${s.review?`최근 검토: ${esc(states[s.review.decision]||s.review.decision)} · ${esc(s.review.note)}`:'아직 검토하지 않았습니다.'}</p><textarea id="teacherNote" class="teacher-note" maxlength="600" placeholder="아이의 사고 변화에서 관찰한 점과 다음 수업에 필요한 도움을 적어줘."></textarea><div class="actions"><button class="btn primary" onclick="review('approve')">승인</button><button class="btn" onclick="review('revise')">수정 요청</button><button class="btn" onclick="review('reject')">반려</button><button class="btn danger" onclick="deleteTeacher()">기록 삭제</button></div><div id="errorBox" class="error"></div>`:'<p class="small">왼쪽에서 체험 기록을 선택해줘.</p>';
$('#screen').innerHTML=`<div class="teacher-top"><section class="card"><div class="sectionhead"><i class="disc"></i><h2>체험 목록</h2></div><div class="teacher-sessions">${listing}</div></section><section class="card">${panel}</section></div>`;
}
async function review(decision){try{await api(`/api/sessions/${encodeURIComponent(teacherSelected)}/review`,{method:'POST',body:JSON.stringify({decision,note:$('#teacherNote').value})});await loadTeacher()}catch(e){error(e)}}
async function deleteTeacher(){if(!teacherSelected||!confirm('선택한 체험 기록을 삭제할까?'))return;try{await api(`/api/sessions/${encodeURIComponent(teacherSelected)}`,{method:'DELETE'});if(current?.id===teacherSelected){current=null;sessionStorage.removeItem('whywhy_demo_sid')}teacherSelected=null;await loadTeacher()}catch(e){error(e)}}
(async()=>{try{lesson=await api('/api/lesson');let sid=sessionStorage.getItem('whywhy_demo_sid');if(sid){try{current=await api(`/api/sessions/${encodeURIComponent(sid)}`);selectedGrade=current.grade}catch(_){sessionStorage.removeItem('whywhy_demo_sid')}}renderStudent()}catch(e){$('#screen').innerHTML=`<div class="card"><h2>서버 연결을 확인해줘</h2><p>${esc(e.message)}</p><p class="small">로컬 서버를 실행한 다음 이 페이지를 열어줘.</p></div>`}})();
</script>
</body>
</html>
